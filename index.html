<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Crime City">
<meta name="theme-color" content="#0a1828">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="./manifest.webmanifest"><title>SKORBININ Crime City</title>
<style>html,body{margin:0;width:100%;height:100%;background:#071422;color:#f9d897;font-family:system-ui,-apple-system,Arial;display:grid;place-items:center;text-align:center}main{padding:25px}h1{letter-spacing:.08em;font-size:26px}p{color:#bfcbd9;line-height:1.6}button{border:1px solid #d2ab67;color:#ffe3b3;background:#1a3046;padding:13px 22px;border-radius:12px;font:700 16px system-ui}</style>
</head><body><main><h1>CRIME CITY</h1><p id="status">Загружаю актуальную версию игры…</p><button id="retry" hidden>Повторить загрузку</button></main>
<script>
(function(){
 var status=document.getElementById('status'),retry=document.getElementById('retry');
 function boot(){
  retry.hidden=true;status.textContent='Загружаю актуальную версию игры…';
  fetch('./city13.html?fresh='+Date.now(),{cache:'no-store'}).then(function(r){
   if(!r.ok)throw new Error('HTTP '+r.status);return r.text()
  }).then(function(html){
   if(!/CRIME CITY 13\.4/.test(html))throw new Error('Файл игры повреждён');
   document.open();document.write(html);document.close();
  }).catch(function(e){
   status.textContent='Не удалось загрузить игру. Проверь интернет и попробуй ещё раз. '+e.message;retry.hidden=false;
  });
 }
 retry.onclick=boot;boot();
})();
</script></body></html>
