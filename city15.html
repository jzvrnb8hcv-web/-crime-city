let joystick=$('joy'),nub=$('nub'),ptr=null;function joySet(e){let q=joystick.getBoundingClientRect(),x=e.clientX-q.left-q.width/2,y=e.clientY-q.top-q.height/2,m=q.width*.33,d=Math.hypot(x,y);if(d>m){x=x/d*m;y=y/d*m}joy.x=x/m;joy.y=y/m;nub.style.transform='translate('+x+'px,'+y+'px)'}joystick.addEventListener('pointerdown',e=>{ptr=e.pointerId;joystick.setPointerCapture(ptr);joySet(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===ptr)joySet(e)});function joyOff(){ptr=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',joyOff);joystick.addEventListener('pointercancel',joyOff);

function toggleFoot(){if(player.foot){if(distance(here(),player)>95){toast('Подойди к своей машине');return}player.foot=false;player.speed=0;toast('🚘 Ты снова за рулём')}else{if(player.speed>38){toast('Сначала остановись');return}let x=player.x+Math.cos(player.a+Math.PI/2)*54,y=player.y+Math.sin(player.a+Math.PI/2)*54;if(blocked(x,y,10)){x=player.x-Math.cos(player.a+Math.PI/2)*54;y=player.y-Math.sin(player.a+Math.PI/2)*54}if(blocked(x,y,10)){toast('Нет места для выхода');return}player.fx=x;player.fy=y;player.foot=true;toast('🚶 Ты вышел. Подойди к машине для угона.')}}$('enter').onclick=toggleFoot;

function interact(){if(player.foot){let c=closestCar();if(c){player.foot=false;player.car=c.type;player.x=c.x;player.y=c.y;player.a=c.a;player.speed=0;if(parked.includes(c))parked.splice(parked.indexOf(c),1);else traffic.splice(traffic.indexOf(c),1);wanted=Math.max(wanted,2);toast('🚗 УГОН УДАЛСЯ!\nПОЛИЦИЯ ПОЛУЧИЛА ОРИЕНТИРОВКУ');if(mission?.type==='steal'){mission.step=1;mission.target=places.find(p=>p.type==='depot');mission.desc='Доставь машину в порт'}return}if(distance(here(),player)<88)toggleFoot();return}const p=places.find(q=>distance(q,here())<140);if(!p){toast('Нет точки взаимодействия рядом');return}if(p.type==='repair'){player.hp=100;toast('🔧 МАШИНА ВОССТАНОВЛЕНА')}else if(p.type==='garage'){garage()}else events()}$('interact').onclick=interact;
function roadCar(c,dt){let r=roads[c.route],k=Math.max(0,Math.min(.9999,c.t+c.speed*dt/2500*c.dir));if(k>.995||k<.005)c.dir*=-1;c.t=k;let z=k*(r.pts.length-1),i=Math.min(r.pts.length-2,Math.floor(z)),a=r.pts[i],b=r.pts[i+1],t=z-i;let x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
let closeRed=crossings.some(q=>!greenSignal(q)&&distance(c,q)<83&&distance(point(x,y),q)<distance(c,q));
if(closeRed)return;

function playerTick(dt){let dx=joy.x+(keys['arrowright']?1:0)-(keys['arrowleft']?1:0),dy=joy.y+(keys['arrowdown']?1:0)-(keys['arrowup']?1:0),v=Math.min(1,Math.hypot(dx,dy));let aim=Math.atan2(dy,dx);if(player.foot){if(v>.1){let nx=player.fx+dx/v*140*dt,ny=player.fy+dy/v*140*dt;if(!blocked(nx,player.fy,10))player.fx=nx;if(!blocked(player.fx,ny,10))player.fy=ny}return}
let spec=cars[player.car],max=spec.max*(1+((tune[player.car]||[])[0]||0)*.05),desired=v>.13?max*v*(turbo?1.25:1):0;if(brake)desired=0;player.speed+=(desired-player.speed)*Math.min(1,dt*(brake?8:3));if(v>.13){let delta=(aim-player.a+Math.PI*3)%(Math.PI*2)-Math.PI,rate=dt*spec.turn*(.38+.62*Math.min(1,player.speed/120));player.a+=Math.sign(delta)*Math.min(Math.abs(delta),rate);player.speed*=1-.008*Math.abs(delta)}let x=player.x+Math.cos(player.a)*player.speed*dt,y=player.y+Math.sin(player.a)*player.speed*dt;if(!vehicleCollision(x,player.y))player.x=x;else{if(player.speed>100){wanted=Math.min(5,wanted+.2);player.hp=Math.max(15,player.hp-2)}player.speed*=.15}if(!vehicleCollision(player.x,y))player.y=y;else player.speed*=.15}

function draw(){ctx.fillStyle='#102632';ctx.fillRect(0,0,W,H);for(const a of areas){let q=screen(a.x,a.y);ctx.fillStyle=a.color;ctx.fillRect(q.x,q.y,a.w*zoom,a.h*zoom)}ctx.fillStyle='#195369';ctx.beginPath();for(let i=0;i<8;i++){let q=screen(...[[2120,1830],[2440,1770],[2770,1980],[3140,2420],[3200,3500],[2360,3500],[2120,1830],[2120,1830]][i]);if(i)ctx.lineTo(q.x,q.y);else ctx.moveTo(q.x,q.y)}ctx.fill();for(const r of roads){roadLine(r.pts,r.w+20,'#899498');roadLine(r.pts,r.w,r.kind==='highway'?'#35444d':r.kind==='industrial'?'#45494b':'#35414b');roadLine(r.pts,3,'#d7c79988')}for(const crossing of crossings){let p=screen(crossing.x,crossing.y);ctx.fillStyle='#0c1a22';ctx.fillRect(p.x-5,p.y-12,10,24);ctx.shadowColor=greenSignal(crossing)?'#46eb95':'#ff4750';ctx.shadowBlur=12;ctx.fillStyle=ctx.shadowColor;ctx.beginPath();ctx.arc(p.x,p.y-4,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const q of crossings){let p=screen(q.x,q.y);if(p.x< -20||p.x>W+20||p.y< -20||p.y>H+20)continue;ctx.fillStyle='#101723';ctx.fillRect(p.x-4,p.y-14,9,17);ctx.fillStyle=greenSignal(q)?'#3cf08b':'#ff4957';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(p.x,p.y-9,3.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}

for(const b of houses)drawHouse(b);for(const p of parked)carDraw(p,p.type,.95);for(const p of traffic)carDraw(p,p.type,.95);for(const p of police)carDraw(p,9,1,true);for(const p of walkers){let q=screen(p.x,p.y);if(q.x<0||q.x>W||q.y<0||q.y>H)continue;ctx.fillStyle='#e6c7a4';ctx.beginPath();ctx.arc(q.x,q.y,3.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6b91a0';ctx.fillRect(q.x-2,q.y+2,4,5)}carDraw(player,player.car,1.15);if(player.foot){let q=screen(player.fx,player.fy);ctx.fillStyle='#f3cd9e';ctx.beginPath();ctx.arc(q.x,q.y-5,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172532';ctx.fillRect(q.x-4,q.y,8,12);ctx.strokeStyle='#fbd87b';ctx.beginPath();ctx.arc(q.x,q.y,13,0,Math.PI*2);ctx.stroke()}for(const p of places){let q=screen(p.x,p.y);if(q.x<0||q.y<0||q.x>W||q.y>H)continue;ctx.strokeStyle='#f6cf7b';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(q.x,q.y,13,0,Math.PI*2);ctx.stroke()}if(mission?.target){let q=screen(mission.target.x,mission.target.y);ctx.shadowColor='#ffcd77';ctx.shadowBlur=15;ctx.fillStyle='#ffd287';ctx.beginPath();ctx.arc(q.x,q.y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}drawMini()}
